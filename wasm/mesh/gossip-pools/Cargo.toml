[package]
name = "gossip-pools"
version.workspace = true
edition = "2021"
rust-version = "1.98"
license.workspace = true
description = "Gossip P2P backend: the three replicated message pools (counter, key-value, hash) on redb"

[dependencies]
gossip-wire = { workspace = true }
gossip-repl = { workspace = true, optional = true }
massa_hash = { workspace = true }
massa_signature = { workspace = true }
massa_serialization = { workspace = true }
redb = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# No log line in a release build (privacy rule): `quiet-release` compiles every
# `tracing` line out of the release profile. Only the full-debug build of the app
# leaves it out (`--no-default-features --features full-debug` on gossip-mobile).
default = ["quiet-release"]
quiet-release = ["tracing/release_max_level_off", "gossip-repl?/quiet-release"]
full-debug = ["gossip-repl?/full-debug"]
# `impl gossip_repl::BlobStore for PoolsStore`
blob-store = ["dep:gossip-repl"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
proptest = { workspace = true }
