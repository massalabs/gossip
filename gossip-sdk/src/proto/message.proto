syntax = "proto3";

package gossip.protocol;

message Message {
  enum MessageType {
    MESSAGE_TYPE_REGULAR = 0;
    MESSAGE_TYPE_REPLY = 1;
    MESSAGE_TYPE_FORWARD = 2;
    MESSAGE_TYPE_KEEP_ALIVE = 3;
    MESSAGE_TYPE_DELETE = 4;
    MESSAGE_TYPE_EDIT = 5;
    MESSAGE_TYPE_REACTION = 6;
    MESSAGE_TYPE_RETENTION_POLICY = 7;
    MESSAGE_TYPE_GROUP = 8;
  }

  MessageType messageType = 1;
  optional bytes messageId = 2;
  string content = 3;
  optional bytes citedMsgId = 4;
  optional bytes citedContactId = 5;
  optional string forwardedContent = 6;
  // The group plaintext of a MESSAGE_TYPE_GROUP message (plausibly deniable
  // group chats), its only field. It is read under that type only and ignored
  // under any other.
  optional bytes groupPlaintext = 7;
}
